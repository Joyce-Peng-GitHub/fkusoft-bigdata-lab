services:
  mysql:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-course_root_dev_only}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bigdata}
      MYSQL_USER: ${MYSQL_USER:-course}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course_dev_only}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [bigdata]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fkusoft-bigdata-course:python_3.12-hadoop_3.5
    hostname: backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bigdata}
      MYSQL_USER: ${MYSQL_USER:-course}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-course_dev_only}
      SPARK_LOCAL_IP: 127.0.0.1
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
      - "127.0.0.1:${HDFS_PORT:-9870}:9870"
      - "127.0.0.1:${YARN_PORT:-8088}:8088"
      - "127.0.0.1:${SPARK_PORT:-4040}:4040"
    volumes:
      - hadoop-data:/hadoop-data
      - ./tests:/workspace/tests:ro
      - ./spark:/workspace/spark:ro
      - ./ml:/workspace/ml
      - ./scripts:/workspace/scripts:ro
      - ./backend:/workspace/backend
      - ./data:/workspace/data
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./config/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 10G
    command: ["sh", "/workspace/scripts/start-course.sh"]
    networks: [bigdata]

  frontend:
    image: node:24.21.0-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on: [backend]
    environment:
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks: [bigdata]

networks:
  bigdata:

volumes:
  hadoop-data:
  mysql-data:
  frontend-node-modules:
